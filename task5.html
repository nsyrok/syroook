<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shannon Entropy - Task 5</title>
    
    <style>
        /* --- ОБЩИЙ СИНИЙ ДИЗАЙН --- */
        body {
            background-color: #e6f0fa;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            position: relative;
            overflow-x: hidden;
            padding: 40px 20px;
            box-sizing: border-box;
        }

        /* Фоновые круги */
        .bg-circle {
            position: absolute;
            border-radius: 50%;
            background-color: #cce0ff;
            opacity: 0.5;
            z-index: -1;
        }
        .bg-c1 { width: 300px; height: 300px; top: 10%; left: 5%; }
        .bg-c2 { width: 200px; height: 200px; bottom: 5%; right: 10%; }
        .bg-c3 { width: 100px; height: 100px; top: 30%; right: 25%; }

        h1 {
            color: #1a365d;
            font-size: 42px;
            margin-bottom: 10px;
            font-weight: 700;
            text-align: center;
        }

        /* Формула */
        .formula {
            font-size: 24px;
            color: #1a365d;
            font-weight: bold;
            margin-bottom: 30px;
            background: white;
            padding: 10px 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(150, 180, 255, 0.2);
        }

        .calc-card {
            background-color: white;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(150, 180, 255, 0.4);
            padding: 40px 50px;
            text-align: center;
            margin-bottom: 30px;
            width: 100%;
            max-width: 600px;
            box-sizing: border-box;
        }

        .instruction {
            font-size: 18px;
            color: #1a365d;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .inputs-row {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        /* Поля ввода */
        input[type="number"] {
            width: 90px;
            padding: 12px;
            border: 2px solid #cce0ff;
            border-radius: 10px;
            text-align: center;
            font-size: 18px;
            color: #1a365d;
            outline: none;
        }
        input[type="number"]:focus { border-color: #4a7ab5; }
        
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        /* Кнопка Calculate */
        .calc-btn {
            background-color: #cce0ff;
            color: #1a365d;
            border: none;
            padding: 12px 40px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            width: 100%;
            max-width: 300px;
            margin: 0 auto;
            transition: background-color 0.3s;
        }
        .calc-btn:hover { background-color: #a3c4ff; }

        /* Блок для вывода результата */
        .result {
            margin-top: 20px;
            font-size: 24px;
            color: #1a365d;
            font-weight: bold;
            display: none;
            background-color: #f5f9ff;
            padding: 15px;
            border-radius: 15px;
        }

        /* --- КНОПКИ ПЕРЕКЛЮЧЕНИЯ ЗАДАНИЙ (PREV / NEXT) --- */
        .task-nav-buttons {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 600px;
            margin-bottom: 20px;
            gap: 15px;
        }
        
        .nav-arrow-btn {
            background-color: white;
            color: #1a365d;
            text-decoration: none;
            padding: 15px 20px;
            border-radius: 15px;
            font-weight: bold;
            font-size: 16px;
            border: 2px solid #cce0ff;
            box-shadow: 0 4px 10px rgba(150, 180, 255, 0.2);
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 1;
        }
        .nav-arrow-btn:hover {
            background-color: #cce0ff;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(150, 180, 255, 0.4);
        }

        /* --- НИЖНИЕ КНОПКИ HOME И TASKS --- */
        .action-buttons { 
            display: flex; 
            gap: 20px; 
            width: 100%; 
            justify-content: center; 
        }
        .main-btn {
            display: block;
            padding: 15px 40px;
            background-color: #7a9cc6;
            color: white;
            text-align: center;
            text-decoration: none;
            font-size: 20px;
            font-weight: bold;
            border-radius: 15px;
            transition: background-color 0.3s;
            box-sizing: border-box;
            box-shadow: 0 4px 10px rgba(26, 54, 93, 0.3);
            width: 200px;
        }
        .main-btn:hover { background-color: #6a8cb6; }
        
        .btn-tasks { background-color: #1a365d; }
        .btn-tasks:hover { background-color: #2b4c7e; }
    </style>
</head>
<body>

    <!-- Фоновые круги -->
    <div class="bg-circle bg-c1"></div>
    <div class="bg-circle bg-c2"></div>
    <div class="bg-circle bg-c3"></div>

    <h1>Shannon Entropy</h1>
    
    <!-- Визуализация формулы -->
    <div class="formula">
        H(X) = - &sum; p(i) &middot; log<sub>2</sub> p(i)
    </div>

    <div class="calc-card">
        <div class="instruction">Enter probabilities (%)</div>
        
        <div class="inputs-row">
            <input type="number" id="p1" placeholder="P(1)" value="50">
            <input type="number" id="p2" placeholder="P(2)" value="25">
            <input type="number" id="p3" placeholder="P(3)" value="12.5">
            <input type="number" id="p4" placeholder="P(4)" value="12.5">
        </div>
        
        <button class="calc-btn" onclick="calculateEntropy()">H(X) =</button>

        <div class="result" id="result"></div>
    </div>

    <!-- Кнопки "Назад" и "Вперед" -->
    <div class="task-nav-buttons">
        <a href="task4.html" class="nav-arrow-btn">← Previous Task</a>
        <a href="task6.html" class="nav-arrow-btn">Next Task →</a>
    </div>

    <!-- Нижние кнопки Home и Tasks -->
    <div class="action-buttons">
        <a href="index.html" class="main-btn">Home</a>
        <a href="tasks.html" class="main-btn btn-tasks">Tasks</a>
    </div>

    <script>
        function calculateEntropy() {
            let p1 = parseFloat(document.getElementById('p1').value) || 0;
            let p2 = parseFloat(document.getElementById('p2').value) || 0;
            let p3 = parseFloat(document.getElementById('p3').value) || 0;
            let p4 = parseFloat(document.getElementById('p4').value) || 0;
            
            let resultDiv = document.getElementById('result');
            let probs = [p1/100, p2/100, p3/100, p4/100];
            let sum = probs.reduce((a, b) => a + b, 0);

            if (Math.abs(sum - 1) > 0.01) {
                resultDiv.innerHTML = "<span style='color:red; font-size: 18px;'>Error: The sum of probabilities must be 100%!</span>";
                resultDiv.style.display = 'block';
                return;
            }

            let entropy = 0;
            for (let i = 0; i < probs.length; i++) {
                let p = probs[i];
                if (p > 0) {
                    entropy -= p * Math.log2(p);
                }
            }

            resultDiv.innerHTML = `H(X) = <span style="color:#2b4c7e; font-size: 32px;">${entropy.toFixed(4)}</span> bit`;
            resultDiv.style.display = 'block';
        }
    </script>
</body>
</html>
