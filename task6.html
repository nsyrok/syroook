<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSA Encryption - Task 6</title>
    
    <style>
        /* --- ОБЩИЙ СИНИЙ ДИЗАЙН --- */
        body {
            background-color: #e6f0fa;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            position: relative;
            overflow-x: hidden;
            padding: 40px 20px;
            box-sizing: border-box;
        }

        /* Декоративные фоновые круги */
        .bg-circle {
            position: absolute;
            border-radius: 50%;
            background-color: #cce0ff;
            opacity: 0.5;
            z-index: -1;
        }
        .bg-c1 { width: 300px; height: 300px; top: 5%; left: 5%; }
        .bg-c2 { width: 250px; height: 250px; bottom: 5%; right: 5%; }

        h1 {
            color: #1a365d;
            font-size: 32px;
            margin-bottom: 20px;
            font-weight: 700;
            text-align: center;
            max-width: 800px;
        }

        /* Белая карточка */
        .calc-card {
            background-color: white;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(150, 180, 255, 0.4);
            padding: 30px 40px;
            text-align: center;
            width: 100%;
            max-width: 600px;
            box-sizing: border-box;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        label {
            display: block;
            color: #1a365d;
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 16px;
        }

        /* Выпадающий список */
        select {
            width: 200px;
            padding: 10px;
            border: 2px solid #cce0ff;
            border-radius: 10px;
            font-size: 16px;
            color: #1a365d;
            outline: none;
            background-color: white;
            cursor: pointer;
            font-weight: bold;
        }
        select:focus { border-color: #4a7ab5; }

        textarea {
            width: 100%;
            height: 80px;
            padding: 10px;
            border: 2px solid #cce0ff;
            border-radius: 15px;
            font-size: 16px;
            color: #1a365d;
            resize: none;
            outline: none;
            box-sizing: border-box;
            font-family: monospace;
        }
        textarea:focus { border-color: #4a7ab5; }

        .calc-btn {
            background-color: #cce0ff;
            color: #1a365d;
            border: none;
            padding: 12px 40px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            margin: 15px 0;
            transition: background-color 0.3s;
            min-width: 150px;
        }
        .calc-btn:hover { background-color: #a3c4ff; }

        .time-display {
            margin-top: 15px;
            font-size: 16px;
            color: #1a365d;
            text-align: center;
            background-color: #f5f9ff;
            padding: 10px;
            border-radius: 10px;
        }
        .time-display span { font-weight: bold; color: #2b4c7e; }

        /* --- КНОПКИ ПЕРЕКЛЮЧЕНИЯ ЗАДАНИЙ (PREV / NEXT) --- */
        .task-nav-buttons {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 600px;
            margin-bottom: 20px;
            gap: 15px;
        }
        
        .nav-arrow-btn {
            background-color: white;
            color: #1a365d;
            text-decoration: none;
            padding: 15px 20px;
            border-radius: 15px;
            font-weight: bold;
            font-size: 16px;
            border: 2px solid #cce0ff;
            box-shadow: 0 4px 10px rgba(150, 180, 255, 0.2);
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 1;
        }
        .nav-arrow-btn:hover {
            background-color: #cce0ff;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(150, 180, 255, 0.4);
        }

        /* --- НИЖНИЕ КНОПКИ HOME И TASKS --- */
        .action-buttons { 
            display: flex; 
            gap: 20px; 
            width: 100%; 
            justify-content: center; 
        }
        .main-btn {
            display: block;
            padding: 15px 40px;
            background-color: #7a9cc6;
            color: white;
            text-align: center;
            text-decoration: none;
            font-size: 20px;
            font-weight: bold;
            border-radius: 15px;
            transition: background-color 0.3s;
            box-sizing: border-box;
            box-shadow: 0 4px 10px rgba(26, 54, 93, 0.3);
            width: 200px;
        }
        .main-btn:hover { background-color: #6a8cb6; }
        
        .btn-tasks { background-color: #1a365d; }
        .btn-tasks:hover { background-color: #2b4c7e; }
    </style>
</head>
<body>

    <div class="bg-circle bg-c1"></div>
    <div class="bg-circle bg-c2"></div>

    <h1>Supervised Guided Independent Work<br>(DL) RSA encryption algorithm</h1>

    <div class="calc-card">
        <div class="form-group">
            <label for="keySize">Key size (bits):</label>
            <select id="keySize">
                <option value="512">512</option>
                <option value="1024" selected>1024</option>
                <option value="2048">2048</option>
            </select>
        </div>

        <div class="form-group">
            <label for="initialText">Initial text:</label>
            <textarea id="initialText" placeholder="Enter text to encrypt...">Hello RSA!</textarea>
        </div>

        <button class="calc-btn" onclick="processRSA()">Go</button>

        <div class="form-group">
            <label for="encryptedText">Encrypted text:</label>
            <textarea id="encryptedText" readonly placeholder="Encrypted text will appear here..."></textarea>
        </div>

        <div class="form-group">
            <label for="decryptedText">Decrypted text:</label>
            <textarea id="decryptedText" readonly placeholder="Decrypted text will appear here..."></textarea>
        </div>

        <div class="time-display">
            Start: <span id="time-start">-</span><br>
            End: <span id="time-end">-</span><br>
            Duration: <span id="time-duration">-</span>
        </div>
    </div>

    <!-- Кнопки "Назад" и "Вперед" -->
    <div class="task-nav-buttons">
        <a href="task5.html" class="nav-arrow-btn">← Previous Task</a>
        <a href="task7.html" class="nav-arrow-btn">Next Task →</a>
    </div>

    <!-- Нижние кнопки Home и Tasks -->
    <div class="action-buttons">
        <a href="index.html" class="main-btn">Home</a>
        <a href="tasks.html" class="main-btn btn-tasks">Tasks</a>
    </div>

    <script>
        // --- УЧЕБНАЯ МОДЕЛЬ RSA ---
        const p = 61;
        const q = 53;
        const n = p * q; 
        const phi = (p - 1) * (q - 1); 
        const e = 17; 
        let d = 1;
        while ((d * e) % phi !== 1) { d++; }

        function modPow(base, exp, mod) {
            let result = 1;
            base = base % mod;
            while (exp > 0) {
                if (exp % 2 === 1) result = (result * base) % mod;
                exp = Math.floor(exp / 2);
                base = (base * base) % mod;
            }
            return result;
        }

        function processRSA() {
            let text = document.getElementById('initialText').value;
            
            // --- СТАРТ ЗАМЕРА ВРЕМЕНИ ---
            let startTime = performance.now();
            document.getElementById('time-start').textContent = new Date().toLocaleTimeString();

            // --- ШИФРОВАНИЕ ---
            let encryptedArray = [];
            for (let i = 0; i < text.length; i++) {
                let charCode = text.charCodeAt(i);
                let encryptedChar = modPow(charCode, e, n);
                encryptedArray.push(encryptedChar);
            }
            let encryptedText = encryptedArray.join(' ');
            document.getElementById('encryptedText').value = encryptedText;

            // --- ДЕШИФРОВАНИЕ ---
            let decryptedArray = [];
            let encryptedNumbers = encryptedText.split(' ').map(Number);
            for (let i = 0; i < encryptedNumbers.length; i++) {
                let decryptedChar = modPow(encryptedNumbers[i], d, n);
                decryptedArray.push(String.fromCharCode(decryptedChar));
            }
            let decryptedText = decryptedArray.join('');
            document.getElementById('decryptedText').value = decryptedText;

            // --- КОНЕЦ ЗАМЕРА ВРЕМЕНИ ---
            let endTime = performance.now();
            document.getElementById('time-end').textContent = new Date().toLocaleTimeString();
            
            let duration = endTime - startTime;
            document.getElementById('time-duration').textContent = duration.toFixed(4) + " ms";
        }
    </script>
</body>
</html>
