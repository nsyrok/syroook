<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binary algorithm - Task 4</title>
    
    <style>
        /* --- ОБЩИЙ СИНИЙ ДИЗАЙН --- */
        body {
            background-color: #e6f0fa;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            position: relative;
            overflow-x: hidden;
            padding: 40px 20px;
            box-sizing: border-box;
        }

        /* Декоративные фоновые круги */
        .bg-circle {
            position: absolute;
            border-radius: 50%;
            background-color: #cce0ff;
            opacity: 0.5;
            z-index: -1;
        }
        .bg-c1 { width: 250px; height: 250px; top: 10%; left: 10%; }
        .bg-c2 { width: 300px; height: 300px; bottom: -5%; right: 5%; }
        .bg-c3 { width: 120px; height: 120px; top: 20%; right: 20%; }

        h1 {
            color: #1a365d;
            font-size: 42px;
            margin-bottom: 20px;
            font-weight: 700;
            text-align: center;
        }

        /* Блок с формулой */
        .formula {
            font-size: 36px;
            font-weight: 900;
            font-style: italic;
            color: #1a365d;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            letter-spacing: 2px;
        }

        .calc-card {
            background-color: white;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(150, 180, 255, 0.4);
            padding: 40px 50px;
            text-align: center;
            margin-bottom: 30px;
            width: 100%;
            max-width: 450px;
            box-sizing: border-box;
        }

        .input-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 25px;
            font-size: 24px;
            color: #1a365d;
            font-weight: bold;
        }

        /* Поле ввода */
        input[type="number"] {
            width: 100px;
            padding: 10px;
            border: 2px solid #cce0ff;
            border-radius: 10px;
            text-align: center;
            font-size: 20px;
            color: #1a365d;
            outline: none;
        }
        input[type="number"]:focus { border-color: #4a7ab5; }
        
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        /* Кнопка Calculate */
        .calc-btn {
            background-color: #cce0ff;
            color: #1a365d;
            border: none;
            padding: 12px 40px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
            transition: background-color 0.3s;
        }
        .calc-btn:hover { background-color: #a3c4ff; }

        /* Блок для вывода результата */
        .result {
            margin-top: 20px;
            font-size: 24px;
            color: #1a365d;
            font-weight: bold;
            display: none;
        }

        /* --- КНОПКИ ПЕРЕКЛЮЧЕНИЯ ЗАДАНИЙ (PREV / NEXT) --- */
        .task-nav-buttons {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 600px;
            margin-bottom: 20px;
            gap: 15px;
        }
        
        .nav-arrow-btn {
            background-color: white;
            color: #1a365d;
            text-decoration: none;
            padding: 15px 20px;
            border-radius: 15px;
            font-weight: bold;
            font-size: 16px;
            border: 2px solid #cce0ff;
            box-shadow: 0 4px 10px rgba(150, 180, 255, 0.2);
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 1;
        }
        .nav-arrow-btn:hover {
            background-color: #cce0ff;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(150, 180, 255, 0.4);
        }

        /* --- НИЖНИЕ КНОПКИ HOME И TASKS --- */
        .action-buttons { 
            display: flex; 
            gap: 20px; 
            width: 100%; 
            justify-content: center; 
        }
        .main-btn {
            display: block;
            padding: 15px 40px;
            background-color: #7a9cc6;
            color: white;
            text-align: center;
            text-decoration: none;
            font-size: 20px;
            font-weight: bold;
            border-radius: 15px;
            transition: background-color 0.3s;
            box-sizing: border-box;
            box-shadow: 0 4px 10px rgba(26, 54, 93, 0.3);
            width: 200px;
        }
        .main-btn:hover { background-color: #6a8cb6; }
        
        .btn-tasks { background-color: #1a365d; }
        .btn-tasks:hover { background-color: #2b4c7e; }
    </style>
</head>
<body>

    <!-- Декоративные фоновые круги -->
    <div class="bg-circle bg-c1"></div>
    <div class="bg-circle bg-c2"></div>
    <div class="bg-circle bg-c3"></div>

    <h1>Binary algorithm</h1>

    <!-- Стилизованная формула -->
    <div class="formula">H = K * lb(N)</div>

    <div class="calc-card">
        <div class="input-group">
            <span>lb(</span>
            <input type="number" id="numInput" placeholder="32" value="32">
            <span>) =</span>
        </div>
        
        <button class="calc-btn" onclick="calculateLog()">Calculate</button>

        <div class="result" id="result"></div>
    </div>

    <!-- Кнопки "Назад" и "Вперед" -->
    <div class="task-nav-buttons">
        <a href="task3.html" class="nav-arrow-btn">← Previous Task</a>
        <a href="task5.html" class="nav-arrow-btn">Next Task →</a>
    </div>

    <!-- Нижние кнопки Home и Tasks -->
    <div class="action-buttons">
        <a href="index.html" class="main-btn">Home</a>
        <!-- Исправлено: теперь ведет на tasks.html и называется Tasks -->
        <a href="tasks.html" class="main-btn btn-tasks">Tasks</a>
    </div>

    <script>
        function calculateLog() {
            let n = parseFloat(document.getElementById('numInput').value);
            let resultDiv = document.getElementById('result');

            if (isNaN(n) || n <= 0) {
                resultDiv.textContent = "Please enter a positive number!";
                resultDiv.style.color = "#b02a2a"; 
                resultDiv.style.display = 'block';
                return;
            }

            let result = Math.log2(n);
            let roundedResult = Number.isInteger(result) ? result : result.toFixed(4);

            resultDiv.innerHTML = `lb(${n}) = <span style="color:#2b4c7e; font-size: 28px;">${roundedResult}</span>`;
            resultDiv.style.color = "#1a365d";
            resultDiv.style.display = 'block';
        }
    </script>
</body>
</html>
